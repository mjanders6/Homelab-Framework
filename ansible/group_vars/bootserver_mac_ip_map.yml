---
# Per-node MAC/IP map. Prefer setting MAC/IP in .env (see .env.example);
# Ansible overlays those env vars at render time. Gateway/DNS fall back to
# ansible/group_vars/network.yml when omitted here.
#
# In runcmd strings, use __K3S_SERVER_IP__ — replaced with pi5's resolved IP.

pi5:
  mac: ""
  ip: "192.168.1.51"
  packages:
    - docker.io
    - curl
    - jq
    - nfs-common
  runcmd:
    - "curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC=\"server --write-kubeconfig-mode 644\" sh -"

pi4_network:
  mac: ""
  ip: "192.168.1.52"
  packages:
    - docker.io
    - tailscale
    - curl
    - jq
  runcmd:
    - "curl -sfL https://get.k3s.io | K3S_URL=https://__K3S_SERVER_IP__:6443 K3S_TOKEN=changeme sh -"

pi4_monitor:
  mac: ""
  ip: "192.168.1.53"
  packages:
    - docker.io
    - prometheus-node-exporter
    - curl
    - jq
  runcmd:
    - "curl -sfL https://get.k3s.io | K3S_URL=https://__K3S_SERVER_IP__:6443 K3S_TOKEN=changeme sh -"

pi4_backup:
  mac: ""
  ip: "192.168.1.54"
  packages:
    - docker.io
    - restic
    - nfs-common
    - samba
  runcmd:
    - "curl -sfL https://get.k3s.io | K3S_URL=https://__K3S_SERVER_IP__:6443 K3S_TOKEN=changeme sh -"
